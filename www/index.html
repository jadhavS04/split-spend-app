<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Split Spend</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2433;--mu:#6b7385;--ac:#2f6df6;--gr:#1a9b5b;--rd:#d6453d;--bd:#e3e6ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212b;--tx:#eef0f5;--mu:#98a0b3;--ac:#6b9bff;--gr:#43c985;--rd:#ff7a72;--bd:#2c3340}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
button{border:0;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:600;background:var(--ac);color:#fff}
button.g{background:transparent;color:var(--mu);padding:6px 8px;font-weight:500}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum div{background:var(--bg);border-radius:10px;padding:10px}
.sum small{color:var(--mu);display:block}
.sum b{font-size:20px}
.p{display:flex;justify-content:space-between;align-items:center}
.p h3{margin:0;font-size:17px}
.tot{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--bg);border-radius:20px;padding:4px 10px;font-size:14px}
.chip span{color:var(--mu);margin-left:6px}
.bal{font-size:14px;font-weight:600}
.pos{color:var(--gr)}.neg{color:var(--rd)}
.mu{color:var(--mu);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Split Spend</h1>
<div class="card">
  <div class="row"><input id="name" placeholder="Add person name" maxlength="30"><button onclick="addP()">Add</button></div>
</div>
<div class="card sum" id="sum"></div>
<div id="list"></div>
<div class="card"><b>Backup</b><textarea id="bk" rows="3" style="width:100%;margin:8px 0;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)" placeholder="Paste backup here to restore"></textarea><div class="row"><button onclick="expB()">Export backup</button><button onclick="impB()">Restore</button></div></div>
<button class="g" onclick="resetAll()">Reset everything</button>
</main>
<script>
var K="splitspend.v1",S={people:[]};
var P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Preferences;
async function rd(){try{if(P){var r=await P.get({key:K});if(r&&r.value)return r.value}}catch(e){}try{return localStorage.getItem(K)}catch(e){return null}}
function save(){var v=JSON.stringify(S);try{localStorage.setItem(K,v)}catch(e){}try{if(P)P.set({key:K,value:v})}catch(e){}}
async function init(){var r=await rd();try{if(r)S=JSON.parse(r)||S}catch(e){}if(!S.people)S.people=[];draw()}
function expB(){var t=document.getElementById("bk");t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}alert("Backup copied. Paste it in Notes/WhatsApp to keep it safe.")}
function impB(){try{var d=JSON.parse(document.getElementById("bk").value);if(!d.people)throw 0;S=d;save();draw();alert("Restored")}catch(e){alert("Invalid backup text")}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function f(n){return "₹"+(Math.round(n*100)/100).toLocaleString("en-IN",{maximumFractionDigits:2})}
function tot(p){return p.spends.reduce(function(a,b){return a+b},0)}
function addP(){var i=document.getElementById("name"),v=i.value.trim();if(!v)return;S.people.push({id:Date.now(),name:v,spends:[]});i.value="";save();draw()}
function addS(id){var i=document.getElementById("a"+id),v=parseFloat(i.value);if(!(v>0))return;S.people.find(function(p){return p.id===id}).spends.push(v);save();draw()}
function delS(id,k){S.people.find(function(p){return p.id===id}).spends.splice(k,1);save();draw()}
function delP(id){if(confirm("Remove this person?")){S.people=S.people.filter(function(p){return p.id!==id});save();draw()}}
function resetAll(){if(confirm("Clear all people and spends?")){S.people=[];save();draw()}}
function draw(){
  var n=S.people.length,t=S.people.reduce(function(a,p){return a+tot(p)},0),sh=n?t/n:0;
  document.getElementById("sum").innerHTML='<div><small>Total spend</small><b>'+f(t)+'</b></div><div><small>Each person pays</small><b>'+f(sh)+'</b></div><div style="grid-column:1/-1"><small>People</small><b>'+n+'</b></div>';
  var h="";
  if(!n)h='<p class="mu">Add at least 3 people to get started.</p>';
  S.people.forEach(function(p){
    var s=tot(p),b=s-sh,bt=Math.abs(b)<0.005?'<span class="bal">Settled</span>':b>0?'<span class="bal pos">Gets back '+f(b)+'</span>':'<span class="bal neg">Owes '+f(-b)+'</span>';
    h+='<div class="card"><div class="p"><h3>'+esc(p.name)+'</h3><button class="g" onclick="delP('+p.id+')">Remove</button></div>'
     +'<div class="p"><span class="tot">Spent '+f(s)+'</span>'+bt+'</div><div class="chips">'
     +p.spends.map(function(v,k){return '<div class="chip">'+f(v)+'<span onclick="delS('+p.id+','+k+')">✕</span></div>'}).join("")
     +'</div><div class="row"><input id="a'+p.id+'" type="number" inputmode="decimal" placeholder="Amount spent"><button onclick="addS('+p.id+')">+ Add</button></div></div>';
  });
  document.getElementById("list").innerHTML=h;
}
init();
</script>
</body>
</html>
